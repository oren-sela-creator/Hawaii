<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trip to Hawaii 2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root { --ocean:#0a2342; --sky:#1a6b9a; --gold:#d4a853; --coral:#e05b4b; --white:#ffffff; }
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--ocean);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;position:relative;}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(26,107,154,.35) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(212,168,83,.12) 0%,transparent 50%);pointer-events:none;}
    .page{max-width:720px;margin:0 auto;padding:60px 24px 80px;position:relative;z-index:1;}
    .header{text-align:center;margin-bottom:56px;animation:fadeDown .7s ease both;}
    .header .tag{display:inline-block;font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:16px;opacity:.9;}
    .header h1{font-family:'Playfair Display',serif;font-size:clamp(2.4rem,6vw,3.6rem);color:var(--white);line-height:1.1;}
    .header h1 span{color:var(--gold);}
    .header .subtitle{margin-top:12px;font-size:14px;color:rgba(255,255,255,.85);font-weight:500;}
    .divider{width:48px;height:2px;background:linear-gradient(to right,var(--gold),var(--coral));margin:20px auto 0;border-radius:2px;}
    .section-label{font-size:11px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:20px;animation:fadeUp .6s .2s ease both;}
    .flight-card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:28px 32px;margin-bottom:20px;backdrop-filter:blur(12px);transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;animation:fadeUp .6s ease both;text-decoration:none;display:block;cursor:pointer;}
    .flight-card:nth-child(1){animation-delay:.3s;}
    .flight-card:nth-child(2){animation-delay:.45s;}
    .flight-card:hover{transform:translateY(-4px);border-color:rgba(212,168,83,.35);box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
    .airline-logo{
      display:inline-flex;align-items:center;justify-content:center;
      background:white;border-radius:8px;padding:6px 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
      cursor: pointer;
      position: relative;
    }
    .airline-logo:hover {
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 8px 24px rgba(212,168,83,0.5), 0 0 0 2px rgba(212,168,83,0.4);
      filter: brightness(1.05);
    }
    .airline-logo:active {
      transform: scale(0.95) translateY(1px);
      box-shadow: 0 2px 8px rgba(212,168,83,0.3);
      filter: brightness(0.95);
    }
    @keyframes logoPulse {
      0%   { box-shadow: 0 0 0 0 rgba(212,168,83,0.6); }
      70%  { box-shadow: 0 0 0 10px rgba(212,168,83,0); }
      100% { box-shadow: 0 0 0 0 rgba(212,168,83,0); }
    }
    .airline-logo.pulse { animation: logoPulse 0.4s ease; }
    .date-badge{font-size:12px;font-weight:500;color:rgba(255,255,255,.95);letter-spacing:.5px;font-weight:600;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);padding:5px 12px;border-radius:20px;}
    .route{display:flex;align-items:center;gap:16px;}
    .city{flex:1;}
    .city-code{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;color:var(--white);line-height:1;}
    .city-name{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px;font-weight:500;letter-spacing:.5px;}
    .city.dest{text-align:right;}
    .arrow-line{flex:1;display:flex;align-items:center;justify-content:center;position:relative;}
    .arrow-line::before{content:'';position:absolute;left:0;right:0;height:1px;background:linear-gradient(to right,rgba(212,168,83,.4),rgba(212,168,83,1),rgba(212,168,83,.4));}
    .plane-icon{font-size:18px;position:relative;z-index:1;filter:drop-shadow(0 0 10px rgba(212,168,83,1));font-size:22px;;}
    .link-hint{
      display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding-top:16px;
      border-top:1px solid rgba(255,255,255,.07);font-size:13px;color:var(--gold);
      opacity:1;font-weight:500;
      transition: transform 0.2s ease, color 0.2s ease, letter-spacing 0.2s ease, text-shadow 0.2s ease;
      cursor:pointer;width:fit-content;border-radius:6px;
    }
    .link-hint:hover {
      transform: translateX(4px) scale(1.04);
      color: #f5c96a;
      letter-spacing: 0.5px;
      text-shadow: 0 0 12px rgba(212,168,83,0.8);
    }
    .link-hint:active {
      transform: translateX(2px) scale(0.97);
      color: #fff;
      text-shadow: 0 0 20px rgba(255,255,255,0.6);
    }
    @keyframes linkPulse {
      0%   { text-shadow: 0 0 0px rgba(212,168,83,0.9); }
      50%  { text-shadow: 0 0 16px rgba(212,168,83,0.9); }
      100% { text-shadow: 0 0 0px rgba(212,168,83,0); }
    }
    .link-hint.pulse { animation: linkPulse 0.4s ease; }

    .link-hint svg{width:12px;height:12px;}
    .connector{display:flex;align-items:center;gap:12px;padding:0 16px;margin:-6px 0 14px;animation:fadeUp .5s .55s ease both;opacity:0;animation-fill-mode:forwards;}
    .connector-line{width:2px;height:30px;background:linear-gradient(to bottom,rgba(212,168,83,.4),rgba(212,168,83,.1));margin-left:28px;}
    .connector-text{font-size:11px;color:rgba(255,255,255,.7);letter-spacing:.5px;font-weight:500;}
    .gantt-wrap{margin-top:48px;animation:fadeUp .6s .7s ease both;opacity:0;animation-fill-mode:forwards;}
    .gantt-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:20px;padding:28px 20px;backdrop-filter:blur(12px);overflow-x:auto;}

    /* ── Mobile responsive ── */
    @media (max-width: 480px) {
      .page { padding: 32px 16px 60px; }
      .header h1 { font-size: 2rem; }
      .header .subtitle { font-size: 12px; }
      .flight-card { padding: 18px 16px; }
      .card-top { flex-wrap: wrap; gap: 10px; }
      .airline-logo { max-width: 100%; }
      .airline-logo img { max-width: 100% !important; height: auto !important; max-height: 32px; }
      .city-code { font-size: 1.5rem; }
      .city-name { font-size: 11px; }
      .route { gap: 8px; }
      .date-badge { font-size: 11px; padding: 4px 8px; }
      .gantt-box { padding: 16px 10px; }
    }
    /* Always constrain logo image */
    .airline-logo img { max-width: 100%; height: auto; max-height: 36px; object-fit: contain; }
    .airline-logo { max-width: 45%; flex-shrink: 1; }
    .card-top { flex-wrap: wrap; gap: 8px; align-items: center; }
    @keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
  </style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
  const segments = [
    { label: 'TLV \u2192 LA \u2192 Seattle \u2708', start: 0,  end: 1  },
    { label: 'Seattle \u2708',                       start: 1,  end: 3  },
    { label: 'Vancouver 🚇',                     start: 3,  end: 6  },
    { label: "Hawaii O'ahu (Honolulu) \u2708",       start: 6,  end: 11 },
    { label: 'Hawaii Maui \u2708',                   start: 11, end: 17 },
    { label: 'Hawaii Big Island \u2708',             start: 17, end: 22 },
  ];
  const baseDate = new Date('2026-08-07');
  const totalDays = 23;
  const tickLabels = [];
  for (let i = 0; i <= totalDays; i++) {
    const d = new Date(baseDate);
    d.setDate(d.getDate() + i);
    tickLabels.push(d.getDate() + '/' + (d.getMonth()+1));
  }
  const datasets = segments.map(seg => ({
    label: seg.label,
    data: [{ x: [seg.start, seg.end], y: seg.label }],
    backgroundColor: 'rgba(255,130,50,1)',
    borderRadius: 4,
    borderSkipped: false,
  }));
  // Custom plugin to draw a vertical line for every single day
  const dailyGridPlugin = {
    id: 'dailyGrid',
    afterDraw(chart) {
      const {ctx, chartArea: {top, bottom}, scales: {x}} = chart;
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= totalDays; i++) {
        const xPos = x.getPixelForValue(i);
        ctx.beginPath();
        ctx.moveTo(xPos, top);
        ctx.lineTo(xPos, bottom);
        ctx.stroke();
      }
      // Top and bottom border lines
      ctx.strokeStyle = 'rgba(255,255,255,0.85)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x.getPixelForValue(0), top);
      ctx.lineTo(x.getPixelForValue(totalDays), top);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x.getPixelForValue(0), bottom);
      ctx.lineTo(x.getPixelForValue(totalDays), bottom);
      ctx.stroke();
      ctx.restore();
    }
  };

  function getAspectRatio() {
    return 2.5;
  }

  const ganttChart = new Chart(document.getElementById('ganttChart').getContext('2d'), {
    plugins: [dailyGridPlugin],
    type: 'bar',
    data: { datasets },
    options: {
      indexAxis: 'y',
      responsive: true,
      aspectRatio: 2.5,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const [s,e] = ctx.raw.x;
              const sd = new Date(baseDate); sd.setDate(sd.getDate()+s);
              const ed = new Date(baseDate); ed.setDate(ed.getDate()+e);
              const fmt = d => d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();
              return fmt(sd)+' \u2192 '+fmt(ed);
            }
          }
        }
      },
      scales: {
        x: {
          type: 'linear', min: 0, max: totalDays,
          afterBuildTicks: axis => { axis.ticks = Array.from({length: totalDays+1},(_,i)=>({value:i})); },
          ticks: { stepSize:1, autoSkip:false, color:'rgba(255,255,255,0.9)', font:{ size: Math.max(9, Math.min(12, window.innerWidth / 45)), family: 'DM Sans, sans-serif', weight: '500' }, callback: (v, i) => tickLabels[Math.round(v)] || '', maxRotation:90, minRotation:90 },
          grid: { display: false }
        },
        y: {
          type: 'category',
          labels: segments.map(s=>s.label).reverse(),
          ticks: { color:'rgba(255,255,255,1)', font:{size:12} },
          grid: { display: false }
        }
      }
    }
  });

  // Link-hint animations
  document.querySelectorAll('.link-hint').forEach(link => {
    link.addEventListener('mousedown', () => {
      link.classList.remove('pulse');
      void link.offsetWidth;
      link.classList.add('pulse');
    });
    link.addEventListener('mousemove', e => {
      const rect = link.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width - 0.5) * 10;
      const y = ((e.clientY - rect.top) / rect.height - 0.5) * 10;
      link.style.transform = `perspective(200px) rotateX(${-y}deg) rotateY(${x}deg) translateX(4px) scale(1.04)`;
    });
    link.addEventListener('mouseleave', () => {
      link.style.transform = '';
    });
  });

  // Logo click pulse animation
  document.querySelectorAll('.airline-logo').forEach(logo => {
    logo.addEventListener('mousedown', () => {
      logo.classList.remove('pulse');
      void logo.offsetWidth; // reflow
      logo.classList.add('pulse');
    });
    logo.addEventListener('mousemove', e => {
      const rect = logo.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width - 0.5) * 16;
      const y = ((e.clientY - rect.top) / rect.height - 0.5) * 16;
      logo.style.transform = `perspective(300px) rotateX(${-y}deg) rotateY(${x}deg) scale(1.08)`;
    });
    logo.addEventListener('mouseleave', () => {
      logo.style.transform = '';
    });
  });

  window.addEventListener('resize', () => {
    ganttChart.options.aspectRatio = getAspectRatio();
    ganttChart.options.scales.x.ticks.font = { size: Math.max(7, Math.min(10, window.innerWidth / 50)) };
    ganttChart.resize();
    ganttChart.update();
  });

  // Link-hint animations
  document.querySelectorAll('.link-hint').forEach(link => {
    link.addEventListener('mousedown', () => {
      link.classList.remove('pulse');
      void link.offsetWidth;
      link.classList.add('pulse');
    });
    link.addEventListener('mousemove', e => {
      const rect = link.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width - 0.5) * 10;
      const y = ((e.clientY - rect.top) / rect.height - 0.5) * 10;
      link.style.transform = `perspective(200px) rotateX(${-y}deg) rotateY(${x}deg) translateX(4px) scale(1.04)`;
    });
    link.addEventListener('mouseleave', () => {
      link.style.transform = '';
    });
  });

  // Logo click pulse animation
  document.querySelectorAll('.airline-logo').forEach(logo => {
    logo.addEventListener('mousedown', () => {
      logo.classList.remove('pulse');
      void logo.offsetWidth; // reflow
      logo.classList.add('pulse');
    });
    logo.addEventListener('mousemove', e => {
      const rect = logo.getBoundingClientRect();
      const x = ((e.clientX - rect.left) / rect.width - 0.5) * 16;
      const y = ((e.clientY - rect.top) / rect.height - 0.5) * 16;
      logo.style.transform = `perspective(300px) rotateX(${-y}deg) rotateY(${x}deg) scale(1.08)`;
    });
    logo.addEventListener('mouseleave', () => {
      logo.style.transform = '';
    });
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(() => {
      ganttChart.options.aspectRatio = getAspectRatio();
      ganttChart.resize();
      ganttChart.update();
    }, 100);
  });
</script>
</body>
</html>
