<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trip to Hawaii ✈️</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --ocean: #0a2342;
      --sky: #1a6b9a;
      --foam: #e8f4f8;
      --sand: #f5ead8;
      --gold: #d4a853;
      --coral: #e05b4b;
      --white: #ffffff;
      --text: #1a1a2e;
      --muted: #6b7a8d;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--ocean);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Wave background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(26,107,154,0.35) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(212,168,83,0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 80%, rgba(224,91,75,0.08) 0%, transparent 40%);
      pointer-events: none;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px 80px;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeDown 0.7s ease both;
    }

    .header .tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
      opacity: 0.9;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      color: var(--white);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .header h1 span {
      color: var(--gold);
    }

    .header .subtitle {
      margin-top: 12px;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 0.5px;
    }

    .divider {
      width: 48px;
      height: 2px;
      background: linear-gradient(to right, var(--gold), var(--coral));
      margin: 20px auto 0;
      border-radius: 2px;
    }

    /* Section */
    .section-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 20px;
      animation: fadeUp 0.6s 0.2s ease both;
    }

    /* Flight card */
    .flight-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 20px;
      padding: 28px 32px;
      margin-bottom: 20px;
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      animation: fadeUp 0.6s ease both;
      text-decoration: none;
      display: block;
      cursor: pointer;
    }

    .flight-card:nth-child(1) { animation-delay: 0.3s; }
    .flight-card:nth-child(2) { animation-delay: 0.45s; }
    .flight-card:nth-child(3) { animation-delay: 0.6s; }

    .flight-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212,168,83,0.35);
      box-shadow: 0 20px 60px rgba(0,0,0,0.4), 0 0 0 1px rgba(212,168,83,0.15);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .airline-logo {
      height: 44px;
      width: auto;
      object-fit: contain;
      filter: brightness(1.05);
    }

    .airline-logo.elal {
      background: white;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .airline-logo.delta {
      background: white;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .date-badge {
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.5px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 5px 12px;
      border-radius: 20px;
    }

    .route {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .city {
      flex: 1;
    }

    .city-code {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
    }

    .city-name {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .city.dest {
      text-align: right;
    }

    .arrow-line {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      position: relative;
    }

    .arrow-line::before {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(to right, rgba(212,168,83,0.2), rgba(212,168,83,0.6), rgba(212,168,83,0.2));
    }

    .plane-icon {
      font-size: 18px;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 0 6px rgba(212,168,83,0.6));
    }

    .link-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.07);
      font-size: 12px;
      color: var(--gold);
      opacity: 0.75;
      transition: opacity 0.2s;
    }

    .flight-card:hover .link-hint {
      opacity: 1;
    }

    .link-hint svg {
      width: 12px;
      height: 12px;
    }

    /* Connecting dot */
    .connector {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      margin: -6px 0 14px;
      animation: fadeUp 0.5s 0.55s ease both;
      opacity: 0;
      animation-fill-mode: forwards;
    }

    .connector-line {
      width: 2px;
      height: 30px;
      background: linear-gradient(to bottom, rgba(212,168,83,0.4), rgba(212,168,83,0.1));
      margin-left: 28px;
    }

    .connector-text {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.5px;
    }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
